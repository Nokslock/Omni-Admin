<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%">
<stop offset="0%" stop-color="#1a1a1a"/>
<stop offset="100%" stop-color="#000000"/>
</radialGradient>
<radialGradient id="innerDisc" cx="42%" cy="36%" r="58%">
<stop offset="0%" stop-color="#282828"/>
<stop offset="100%" stop-color="#060606"/>
</radialGradient>
<radialGradient id="kGrad" cx="38%" cy="28%" r="65%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="40%" stop-color="#cccccc"/>
<stop offset="100%" stop-color="#505050"/>
</radialGradient>
<filter id="kGlow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="20" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="outerGlow" x="-10%" y="-10%" width="120%" height="120%">
<feGaussianBlur stdDeviation="10" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="redGlow" x="-150%" y="-150%" width="400%" height="400%">
<feGaussianBlur stdDeviation="10" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redTint" cx="50%" cy="100%" r="55%">
<stop offset="0%" stop-color="#e84040" stop-opacity="0.07"/>
<stop offset="100%" stop-color="#e84040" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="512" cy="512" r="460" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
<circle cx="512" cy="512" r="456" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" filter="url(#outerGlow)"/>
<circle cx="512" cy="512" r="380" fill="none" stroke="rgba(160,160,160,0.14)" stroke-width="2"/>
<circle cx="512" cy="512" r="290" fill="none" stroke="rgba(100,100,100,0.12)" stroke-width="1.5"/>
<circle cx="512" cy="512" r="210" fill="url(#innerDisc)"/>
<circle cx="512" cy="512" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
<!-- Cardinal red dots -->
<circle cx="512" cy="56" r="14" fill="#e84040" filter="url(#redGlow)" opacity="0.95"/>
<circle cx="968" cy="512" r="14" fill="#e84040" filter="url(#redGlow)" opacity="0.95"/>
<circle cx="512" cy="968" r="14" fill="#e84040" filter="url(#redGlow)" opacity="0.95"/>
<circle cx="56" cy="512" r="14" fill="#e84040" filter="url(#redGlow)" opacity="0.95"/>
<!-- Diagonal red dots -->
<circle cx="717" cy="307" r="9" fill="#ff4d4d" filter="url(#redGlow)" opacity="0.65"/>
<circle cx="717" cy="717" r="9" fill="#ff4d4d" filter="url(#redGlow)" opacity="0.65"/>
<circle cx="307" cy="717" r="9" fill="#ff4d4d" filter="url(#redGlow)" opacity="0.65"/>
<circle cx="307" cy="307" r="9" fill="#ff4d4d" filter="url(#redGlow)" opacity="0.65"/>
<!-- K centred -->
<text x="512" y="512" text-anchor="middle" dominant-baseline="central" font-size="340" font-weight="900" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" fill="url(#kGrad)" filter="url(#kGlow)">K</text>
<rect width="1024" height="1024" fill="url(#redTint)"/>
</svg>