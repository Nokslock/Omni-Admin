<svg width="1200" height="630" viewBox="0 0 1200 630" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Kasala Alert — banner image</title>
  <desc>Dark navy banner showing a stylised city grid with incident alert pins and the Kasala Alert wordmark</desc>

  <!-- background -->
  <rect width="1200" height="630" fill="#0b1d2a"/>

  <!-- grid lines -->
  <line x1="120"  y1="0" x2="120"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="240"  y1="0" x2="240"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="360"  y1="0" x2="360"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="480"  y1="0" x2="480"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="600"  y1="0" x2="600"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="720"  y1="0" x2="720"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="840"  y1="0" x2="840"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="960"  y1="0" x2="960"  y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="1080" y1="0" x2="1080" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <line x1="0" y1="126" x2="1200" y2="126" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- city block fills -->
  <rect x="122" y="128" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="242" y="128" width="56"  height="56"  fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="242" y="188" width="56"  height="56"  fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="362" y="128" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="842" y="128" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="962" y="128" width="56"  height="56"  fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="1082" y="128" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="122" y="254" width="56"  height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="182" y="254" width="56"  height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="1082" y="254" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="122" y="380" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="242" y="380" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="842" y="380" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="962" y="380" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>
  <rect x="1082" y="380" width="116" height="116" fill="#ffffff" fill-opacity="0.03" rx="3"/>

  <!-- connection lines between pins -->
  <line x1="640" y1="240" x2="740" y2="340" stroke="#1d9e75" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="820" y1="210" x2="740" y2="340" stroke="#1d9e75" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="740" y1="340" x2="740" y2="490" stroke="#1d9e75" stroke-opacity="0.2"  stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- glow rings: active incident -->
  <circle cx="740" cy="340" r="70" fill="none" stroke="#1d9e75" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="740" cy="340" r="46" fill="none" stroke="#1d9e75" stroke-width="1.5" stroke-opacity="0.22"/>

  <!-- pin: active (green) -->
  <circle cx="740" cy="340" r="20" fill="#1d9e75"/>
  <circle cx="740" cy="340" r="8"  fill="#ffffff"/>

  <!-- pin: unverified (amber) -->
  <circle cx="640" cy="240" r="17" fill="#ba7517"/>
  <circle cx="640" cy="240" r="7"  fill="#ffffff"/>

  <!-- pin: alert (red) -->
  <circle cx="820" cy="210" r="17" fill="#a32d2d"/>
  <circle cx="820" cy="210" r="7"  fill="#ffffff"/>

  <!-- pin: resolved (gray) -->
  <circle cx="740" cy="490" r="13" fill="#5f5e5a"/>
  <circle cx="740" cy="490" r="5"  fill="#ffffff"/>

  <!-- status pills -->
  <rect x="760" y="324" width="84" height="24" rx="12" fill="#0f6e56"/>
  <text x="802" y="341" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600" font-size="13" fill="#ffffff">active</text>

  <rect x="656" y="222" width="110" height="24" rx="12" fill="#854f0b"/>
  <text x="711" y="239" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600" font-size="13" fill="#ffffff">unverified</text>

  <!-- left panel — wordmark + tagline -->
  <rect x="80" y="230" width="5" height="90" rx="2.5" fill="#1d9e75"/>

  <text x="96" y="290" font-family="system-ui,sans-serif" font-weight="700" font-size="64" fill="#ffffff" letter-spacing="-1">Kasala</text>
  <text x="96" y="354" font-family="system-ui,sans-serif" font-weight="700" font-size="64" fill="#1d9e75" letter-spacing="-1">Alert</text>
  <text x="96" y="390" font-family="system-ui,sans-serif" font-weight="400" font-size="22" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Community safety, crowd-verified</text>

  <!-- bottom stat pills -->
  <rect x="80"  y="480" width="148" height="44" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="154" y="507" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" font-size="18" fill="#ffffff">Real-time alerts</text>

  <rect x="240" y="480" width="120" height="44" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="300" y="507" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" font-size="18" fill="#ffffff">10× verify</text>

  <rect x="372" y="480" width="140" height="44" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="442" y="507" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" font-size="18" fill="#ffffff">Auto-resolve</text>

  <!-- teal accent bottom right -->
  <rect x="1040" y="580" width="120" height="3" rx="1.5" fill="#1d9e75" fill-opacity="0.6"/>
</svg>
